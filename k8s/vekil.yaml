apiVersion: apps/v1
kind: Deployment
metadata:
  name: vekil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vekil
  template:
    metadata:
      labels:
        app: vekil
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: vekil
          image: ghcr.io/sozercan/vekil:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 1337
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "1337"
            - name: TOKEN_DIR
              value: /home/nonroot/.config/vekil
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 15
            timeoutSeconds: 12
            failureThreshold: 1
          volumeMounts:
            - name: token-cache
              mountPath: /home/nonroot/.config/vekil
      volumes:
        # Example-only ephemeral cache: it survives a container restart in this
        # Pod, but not Pod replacement/rescheduling. Use a PVC or inject
        # COPILOT_GITHUB_TOKEN from a Secret for persistent production auth.
        - name: token-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vekil
spec:
  selector:
    app: vekil
  ports:
    - name: http
      port: 1337
      targetPort: http
      protocol: TCP
