version: 2

project_name: vekil

builds:
  - id: vekil
    main: .
    binary: vekil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w

archives:
  - id: binaries
    ids:
      - vekil
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: checksums.txt

# Publication is deliberately owned by the protected finalizer in
# .github/workflows/release.yaml. This prevents an accidental GoReleaser
# invocation from gaining a second privileged publication path.
release:
  disable: true
