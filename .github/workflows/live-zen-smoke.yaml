name: Live OpenCode Zen Smoke

# Credential-free live smoke for the OpenCode Zen free tier. Unlike the Live
# Copilot Smoke workflow, this needs no secrets, so it runs on EVERY pull
# request including external-contributor forks. It exercises vekil's generic
# openai-compatible provider routing through an explicit experimental client
# compatibility profile, when the upstream admits anonymous inference.
#
# The Zen free tier rotates and is rate-limited per IP. Require real client
# completions: unavailable canaries or a free-tier refusal must fail CI rather
# than produce a successful neutral skip. Every installed CLI is an independent
# hard gate. See docs/development.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-zen-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Parse current OpenCode Zen free labels
        env:
          OPENCODE_ZEN_DOC_URL: https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx
        run: |
          doc="$RUNNER_TEMP/opencode-zen.mdx"
          models="$RUNNER_TEMP/opencode-zen-free-models.tsv"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            "$OPENCODE_ZEN_DOC_URL" > "$doc"
          scripts/parse-opencode-zen-free-models.sh "$doc" > "$models"
          echo "OpenCode models carrying Free input/output price labels:"
          awk -F '\t' '{ printf "  %s -> %s [%s]\n", $2, $1, $3 }' "$models"
          echo "ZEN_FREE_MODELS_FILE=$models" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest

      - name: Install Claude Code
        env:
          # 2.1.212 exits successfully but produces no normalized headless output
          # against the Zen Chat path. Keep the last verified version pinned.
          CLAUDE_CODE_VERSION: "2.1.211"
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Show CLI versions
        run: |
          copilot --version
          claude --version
          gemini --version

      # Codex is intentionally not installed: it is /responses-only and always
      # sends a nameless web_search tool that Zen free upstreams reject. The
      # Copilot CLI covers the same role via wire_api=completions.

      - name: Run live OpenCode Zen CLI smoke
        env:
          SMOKE_PROVIDER: zen
          ZEN_REQUIRE_LIVE: "1"
          PROVIDERS_CONFIG: examples/opencode-zen-free.yaml
          LIVE_CLI_SMOKE_DIR: ${{ runner.temp }}/live-zen-cli-smoke
          SMOKE_CLI_TIMEOUT_SECONDS: "120"
          SMOKE_CURL_MAX_TIME_SECONDS: "45"
        run: |
          zen_smoke_config="$RUNNER_TEMP/opencode-zen-smoke.yaml"
          zen_smoke_session_id="$(node scripts/opencode-zen-metadata.mjs --session-id)"
          cp "$PROVIDERS_CONFIG" "$zen_smoke_config"
          cat >> "$zen_smoke_config" <<EOF
                x-opencode-session: "$zen_smoke_session_id"
                x-opencode-session-id: "$zen_smoke_session_id"
                x-session-affinity: "$zen_smoke_session_id"
                X-Session-Id: "$zen_smoke_session_id"
          EOF
          ./vekil config validate --providers-config "$zen_smoke_config"
          PROVIDERS_CONFIG="$zen_smoke_config" scripts/live-cli-smoke.sh

      - name: Show proxy log on failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/live-zen-cli-smoke/proxy.log"
          if [ -f "$log" ]; then
            echo "--- $log ---"
            sed -E 's/(Authorization: (Bearer|token) )[[:graph:]]+/\1[REDACTED]/g' "$log"
          fi

  opencode-shaped-control:
    name: OpenCode native baseline and shaped controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pinned diagnostic runtimes
        run: |
          npm install -g bun@1.4.2 "@opencode/cli@$(node scripts/opencode-zen-metadata.mjs --version)"
          opencode --version

      - name: Build Vekil and test the controls offline
        id: build
        run: |
          make build
          bun --no-env-file test scripts/tests/opencode-zen-metadata.test.ts scripts/tests/live-zen-control.test.ts scripts/tests/live-zen-native.test.ts

      - name: Parse current free labels
        id: catalog
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/anomalyco/opencode/dev/services/www/src/docs/content/console/models.mdx \
            > "$RUNNER_TEMP/zen-control-models.mdx"
          scripts/parse-opencode-zen-free-models.sh "$RUNNER_TEMP/zen-control-models.mdx" \
            > "$RUNNER_TEMP/zen-control-models.tsv"

      - name: Run actual OpenCode CLI baseline (no proxy replay)
        env:
          ZEN_FREE_MODELS_FILE: ${{ runner.temp }}/zen-control-models.tsv
          ZEN_NATIVE_DIR: ${{ runner.temp }}/zen-native
        run: bun --no-env-file scripts/live-zen-native.ts

      # Run the separate Vekil-identified diagnostic even when native admission
      # failed. Neither diagnostic replaces the generic-client smoke above.
      - name: Compare Bun reference, Vekil with Bun relay, and native Vekil
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.catalog.outcome == 'success' }}
        env:
          ZEN_FREE_MODELS_FILE: ${{ runner.temp }}/zen-control-models.tsv
          ZEN_CONTROL_DIR: ${{ runner.temp }}/zen-control
        run: bun --no-env-file scripts/live-zen-control.ts

      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zen-opencode-shaped-control
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/zen-control/results.json
            ${{ runner.temp }}/zen-control/summary.md
            ${{ runner.temp }}/zen-control/*/result.json
            ${{ runner.temp }}/zen-control/*/relay-receipt.json
            ${{ runner.temp }}/zen-control/*/response.txt
            ${{ runner.temp }}/zen-control/*/usage.json
            ${{ runner.temp }}/zen-control/*/proxy.log

      - name: Save actual OpenCode CLI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zen-native-cli-control
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/zen-native/results.json
            ${{ runner.temp }}/zen-native/summary.md
            ${{ runner.temp }}/zen-native/*/result.json
            ${{ runner.temp }}/zen-native/*/observer.json
            ${{ runner.temp }}/zen-native/*/request.json
            ${{ runner.temp }}/zen-native/*/response.json
            ${{ runner.temp }}/zen-native/*/response.txt
            ${{ runner.temp }}/zen-native/*/usage.json
            ${{ runner.temp }}/zen-native/*/cli.stdout.jsonl
            ${{ runner.temp }}/zen-native/*/cli.stderr.txt
            ${{ runner.temp }}/zen-native/*/proxy.log
