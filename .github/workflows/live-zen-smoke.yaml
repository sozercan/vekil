name: Live OpenCode Zen Smoke

# Credential-free live smoke for the OpenCode Zen free tier. Unlike the Live
# Copilot Smoke workflow, this needs no secrets, so it runs on EVERY pull
# request including external-contributor forks. It exercises vekil's generic
# openai-compatible provider routing end to end through real coding-agent CLIs.
#
# The Zen free tier rotates and is rate-limited per IP. The script neutral-skips
# only when no model is reachable before any CLI is exercised; once a canary
# reaches a model, every installed CLI is an independent hard gate. See
# docs/development.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-zen-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Parse current OpenCode Zen free labels
        env:
          OPENCODE_ZEN_DOC_URL: https://raw.githubusercontent.com/anomalyco/opencode/dev/packages/web/src/content/docs/zen.mdx
        run: |
          doc="$RUNNER_TEMP/opencode-zen.mdx"
          models="$RUNNER_TEMP/opencode-zen-free-models.tsv"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 60 \
            "$OPENCODE_ZEN_DOC_URL" > "$doc"
          scripts/parse-opencode-zen-free-models.sh "$doc" > "$models"
          echo "OpenCode models carrying Free input/output price labels:"
          awk -F '\t' '{ printf "  %s -> %s [%s]\n", $2, $1, $3 }' "$models"
          echo "ZEN_FREE_MODELS_FILE=$models" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest

      - name: Install Claude Code
        env:
          # 2.1.212 exits successfully but produces no normalized headless output
          # against the Zen Chat path. Keep the last verified version pinned.
          CLAUDE_CODE_VERSION: "2.1.211"
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@latest

      - name: Show CLI versions
        run: |
          copilot --version
          claude --version
          gemini --version

      # Codex is intentionally not installed: it is /responses-only and always
      # sends a nameless web_search tool that Zen free upstreams reject. The
      # Copilot CLI covers the same role via wire_api=completions.

      - name: Run live OpenCode Zen CLI smoke
        env:
          SMOKE_PROVIDER: zen
          PROVIDERS_CONFIG: examples/opencode-zen-free.yaml
          LIVE_CLI_SMOKE_DIR: ${{ runner.temp }}/live-zen-cli-smoke
          SMOKE_CLI_TIMEOUT_SECONDS: "120"
          SMOKE_CURL_MAX_TIME_SECONDS: "45"
        run: scripts/live-cli-smoke.sh

      - name: Show proxy log on failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/live-zen-cli-smoke/proxy.log"
          if [ -f "$log" ]; then
            echo "--- $log ---"
            sed -E 's/(Authorization: (Bearer|token) )[[:graph:]]+/\1[REDACTED]/g' "$log"
          fi
