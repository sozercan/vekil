name: Live Copilot Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-copilot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Require live smoke credential
        id: gate
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "COPILOT_GITHUB_TOKEN repository secret is required for live smoke checks." >&2
            exit 1
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 20

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: make build

      - name: Run live compaction smoke check
        if: steps.gate.outputs.run == 'true'
        id: compact
        env:
          LIVE_COMPACT_SMOKE_DIR: ${{ runner.temp }}/live-compact-smoke
        run: |
          set +e
          scripts/live-compact-smoke.sh
          status=$?
          set -e
          if [ "${status}" -eq 75 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Explain unavailable Copilot live coverage
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'false'
        run: echo "Skipping the remaining Copilot live checks because the repository credential's monthly quota is exhausted."

      - name: Run live Chat-over-Responses smoke check
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'true'
        env:
          LIVE_CHAT_OVER_RESPONSES_SMOKE_DIR: ${{ runner.temp }}/live-chat-over-responses-smoke
        run: scripts/live-chat-over-responses-smoke.sh

      - name: Install Codex CLI
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'true'
        run: npm install -g @openai/codex@latest

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'true'
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run live Claude reasoning-carrier restart smoke
        if: steps.gate.outputs.run == 'true'
        env:
          LIVE_CLAUDE_REASONING_CARRIER_SMOKE_DIR: ${{ runner.temp }}/live-claude-reasoning-carrier-smoke
        run: scripts/live-claude-reasoning-carrier-smoke.sh

      - name: Install Gemini CLI
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'true'
        run: npm install -g @google/gemini-cli@latest

      - name: Show CLI versions
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'true'
        run: |
          codex --version
          claude --version
          gemini --version

      - name: Run live CLI smoke checks
        if: steps.gate.outputs.run == 'true' && steps.compact.outputs.available == 'true'
        env:
          LIVE_CLI_SMOKE_DIR: ${{ runner.temp }}/live-cli-smoke
        run: scripts/live-cli-smoke.sh

      - name: Show proxy logs on failure
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          redact() {
            sed -E \
              -e 's/(Authorization: (Bearer|token) )[[:graph:]]+/\1[REDACTED]/g' \
              -e 's/gh[opusr]_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g' \
              -e 's/github_pat_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g' \
              -e 's/("access_token":"[^"]*")/"access_token":"[REDACTED]"/g' \
              -e 's/("token":"[^"]*")/"token":"[REDACTED]"/g' \
              -e 's/("encrypted_content"[[:space:]]*:[[:space:]]*")[^"]*(")/\1[REDACTED]\2/g' \
              -e 's/vekil1\.[A-Za-z0-9_-]+/[REDACTED_VEKIL_CARRIER]/g' \
              -e 's/(Please visit https:\/\/github\.com\/login\/device and enter code: )[A-Z0-9-]+/\1[REDACTED]/g'
          }
          for log in \
            "$RUNNER_TEMP/live-compact-smoke/proxy.log" \
            "$RUNNER_TEMP/live-chat-over-responses-smoke/proxy.log" \
            "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/proxy-initial.log" \
            "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/proxy-restarted.log" \
            "$RUNNER_TEMP/live-cli-smoke/proxy.log"; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              redact < "$log"
            fi
          done

      - name: Show smoke outputs on failure
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          redact() {
            sed -E \
              -e 's/(Authorization: (Bearer|token) )[[:graph:]]+/\1[REDACTED]/g' \
              -e 's/gh[opusr]_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g' \
              -e 's/github_pat_[A-Za-z0-9_]+/[REDACTED_GITHUB_TOKEN]/g' \
              -e 's/("access_token":"[^"]*")/"access_token":"[REDACTED]"/g' \
              -e 's/("token":"[^"]*")/"token":"[REDACTED]"/g' \
              -e 's/("encrypted_content"[[:space:]]*:[[:space:]]*")[^"]*(")/\1[REDACTED]\2/g' \
              -e 's/vekil1\.[A-Za-z0-9_-]+/[REDACTED_VEKIL_CARRIER]/g' \
              -e 's/(Please visit https:\/\/github\.com\/login\/device and enter code: )[A-Z0-9-]+/\1[REDACTED]/g'
          }
          if [ -d "$RUNNER_TEMP/live-compact-smoke" ]; then
            find "$RUNNER_TEMP/live-compact-smoke" -maxdepth 1 -type f \
              \( -name '*.json' -o -name '*.txt' \) -print0 | while IFS= read -r -d '' file; do
              echo "--- $file ---"
              redact < "$file"
            done
          fi
          if [ -d "$RUNNER_TEMP/live-chat-over-responses-smoke" ]; then
            find "$RUNNER_TEMP/live-chat-over-responses-smoke" -maxdepth 1 -type f \
              \( -name '*.json' -o -name '*.txt' -o -name '*.err' \) -print0 | while IFS= read -r -d '' file; do
              echo "--- $file ---"
              redact < "$file" | { head -c 32768; cat >/dev/null; }
            done
          fi
          if [ -d "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke" ]; then
            for file in \
              "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/summary.txt" \
              "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/selected-model.txt" \
              "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/claude.err" \
              "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/claude-sanitized.json" \
              "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/missing-carrier-single-response.json" \
              "$RUNNER_TEMP/live-claude-reasoning-carrier-smoke/missing-carrier-complex-response.json"; do
              if [ -f "$file" ]; then
                echo "--- $file ---"
                redact < "$file" | { head -c 32768; cat >/dev/null; }
              fi
            done
          fi
          if [ -d "$RUNNER_TEMP/live-cli-smoke/outputs" ]; then
            find "$RUNNER_TEMP/live-cli-smoke/outputs" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
              echo "--- $file ---"
              redact < "$file"
            done
          fi
