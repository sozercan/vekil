name: Live Copilot Semantic Policy Routing Smoke

# Weekly/manual credentialed coverage for schema-v2 semantic routing.
# The wrapper starts a private zero-config Vekil bridge using the repository's
# existing Copilot token, discovers native-Chat models for the broad policy
# matrix, and presents them as controllable static loopback targets. It then
# runs a focused Responses-native gpt-5.6-sol check proving prompt-selected
# low/max effort overrides conflicting client values through the same bridge.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * 1"

permissions:
  contents: read

concurrency:
  group: live-copilot-policy-routing-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-policy:
    name: semantic-policy-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      LIVE_POLICY_ROUTING_COPILOT_LIGHTWEIGHT_MODEL: ${{ vars.LIVE_POLICY_ROUTING_COPILOT_LIGHTWEIGHT_MODEL }}
      LIVE_POLICY_ROUTING_COPILOT_CLASSIFIER_MODEL: ${{ vars.LIVE_POLICY_ROUTING_COPILOT_CLASSIFIER_MODEL }}
      LIVE_POLICY_ROUTING_COPILOT_POWERFUL_PRIMARY_MODEL: ${{ vars.LIVE_POLICY_ROUTING_COPILOT_POWERFUL_PRIMARY_MODEL }}
      # One explicit Opus fallback preserves distinct-model high-effort coverage.
      # Generic smokes and the primary policy route never fall back to Opus.
      LIVE_POLICY_ROUTING_COPILOT_POWERFUL_SECONDARY_MODEL: ${{ vars.LIVE_POLICY_ROUTING_COPILOT_POWERFUL_SECONDARY_MODEL || 'claude-opus-4.7' }}
    steps:
      - name: Require Copilot semantic policy-routing credential
        id: gate
        run: |
          if [ -z "${COPILOT_GITHUB_TOKEN}" ]; then
            echo "COPILOT_GITHUB_TOKEN repository secret is required for the Copilot semantic policy-routing smoke." >&2
            exit 1
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: make build

      - name: Run Copilot-backed semantic policy-routing and Sol effort E2E
        if: steps.gate.outputs.run == 'true'
        env:
          LIVE_POLICY_ROUTING_SMOKE_DIR: ${{ runner.temp }}/live-policy-routing-copilot-smoke
        run: |
          set +e
          scripts/live-policy-routing-copilot-smoke.sh
          status=$?
          set -e
          if [ "${status}" -eq 75 ]; then
            echo "Copilot live policy-routing coverage was neutral-skipped because the repository credential is billing- or quota-unavailable."
            exit 0
          fi
          exit "${status}"
