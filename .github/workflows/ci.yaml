name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.2
          only-new-issues: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Shell smoke reliability tests
        run: |
          bash -n scripts/live-cli-smoke.sh scripts/live-zen-smoke.sh scripts/live-compact-smoke.sh scripts/live-chat-over-responses-smoke.sh scripts/live-provider-routing-smoke.sh scripts/k8s-kind-smoke.sh scripts/tests/live-smoke-reliability-test.sh scripts/tests/live-chat-over-responses-smoke-test.sh scripts/tests/live-provider-routing-smoke-test.sh
          scripts/tests/live-smoke-reliability-test.sh
          scripts/tests/live-chat-over-responses-smoke-test.sh

      - name: Provider routing process smoke
        run: scripts/tests/live-provider-routing-smoke-test.sh

      - name: Test
        run: make test

      - name: Compaction lab
        run: make compaction-lab

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Race detector
        run: go test -race ./... -count=1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, build, test, race]
    env:
      KIND_VERSION: v0.32.0
      KUBECTL_VERSION: v1.36.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install kind and kubectl
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 -o /tmp/kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 -o /tmp/kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          (cd /tmp && sha256sum -c kind.sha256sum)
          sudo install -m 0755 /tmp/kind-linux-amd64 /usr/local/bin/kind

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 -o /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          kind version
          kubectl version --client=true

      - name: Kubernetes operational smoke
        run: scripts/k8s-kind-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, build, test, race]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Verify binary help exits successfully
        run: |
          ./vekil --help > /tmp/vekil-help.txt 2>&1
          grep -q '^Usage of ' /tmp/vekil-help.txt

      - name: Docker build
        run: make docker-build

      - name: Docker build RTK variant
        run: make docker-build-rtk

      - name: Verify RTK variant reduces tool output
        run: make docker-rtk-e2e
