name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-security:
    name: Release contract and supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out full source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pinned release security tools
        run: scripts/release/install-tools.sh actionlint govulncheck gitleaks

      - name: Validate every GitHub Actions workflow
        run: actionlint -color -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Enforce the release workflow contract
        run: scripts/release/test-release-workflow.sh

      - name: Validate expiring vulnerability exceptions
        run: scripts/release/validate-vulnerability-exceptions.py

      - name: Run release helper and packaging tests
        run: |
          for test_script in scripts/tests/release-*.sh scripts/tests/publish-homebrew-cask-test.sh scripts/tests/external-input-*.sh scripts/tests/rtk-update-*.sh; do
            [[ -e "${test_script}" ]] || continue
            "${test_script}"
          done

      - name: Run reachable Go vulnerability analysis
        run: govulncheck ./...

      - name: Scan source for secrets
        run: scripts/release/scan-secrets.sh .

  dependency-review:
    name: Review dependency changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review newly introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.2
          only-new-issues: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Shell smoke reliability tests
        run: |
          bash -n scripts/live-cli-smoke.sh scripts/live-zen-smoke.sh scripts/live-compact-smoke.sh scripts/live-chat-over-responses-smoke.sh scripts/live-provider-routing-smoke.sh scripts/live-policy-routing-smoke.sh scripts/live-policy-routing-copilot-smoke.sh scripts/live-policy-routing-sol-effort-smoke.sh scripts/k8s-kind-smoke.sh scripts/tests/live-smoke-reliability-test.sh scripts/tests/live-chat-over-responses-smoke-test.sh scripts/tests/live-provider-routing-smoke-test.sh scripts/tests/live-policy-routing-smoke-test.sh scripts/tests/live-policy-routing-copilot-smoke-test.sh scripts/tests/live-policy-routing-sol-effort-smoke-test.sh
          scripts/tests/live-smoke-reliability-test.sh
          scripts/tests/live-chat-over-responses-smoke-test.sh

      - name: Provider routing process smoke
        run: scripts/tests/live-provider-routing-smoke-test.sh

      - name: Semantic policy routing process smoke
        run: scripts/tests/live-policy-routing-smoke-test.sh

      - name: Copilot semantic policy wrapper process smoke
        run: scripts/tests/live-policy-routing-copilot-smoke-test.sh

      - name: Sol semantic effort process smoke
        run: scripts/tests/live-policy-routing-sol-effort-smoke-test.sh

      - name: Test
        run: make test

      - name: Compaction lab
        run: make compaction-lab

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Race detector
        run: go test -race ./... -count=1

  windows-launch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test Windows launcher lifecycle
        run: go test . ./launch -count=1

  darwin-launch:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test Darwin launcher lifecycle
        run: go test . ./launch -count=1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, build, test, race]
    env:
      KIND_VERSION: v0.32.0
      KIND_LINUX_AMD64_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      KUBECTL_VERSION: v1.36.1
      KUBECTL_LINUX_AMD64_SHA256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kind and kubectl
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 -o /tmp/kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  /tmp/kind-linux-amd64" | sha256sum -c -
          sudo install -m 0755 /tmp/kind-linux-amd64 /usr/local/bin/kind

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 120 -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_LINUX_AMD64_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          kind version
          kubectl version --client=true

      - name: Kubernetes operational smoke
        run: scripts/k8s-kind-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, build, test, race]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Verify binary help exits successfully
        run: |
          ./vekil --help > /tmp/vekil-help.txt 2>&1
          grep -q '^Usage of ' /tmp/vekil-help.txt

      - name: Docker build
        run: make docker-build

      - name: Docker build RTK variant
        run: make docker-build-rtk

      - name: Verify RTK variant reduces tool output
        run: make docker-rtk-e2e
