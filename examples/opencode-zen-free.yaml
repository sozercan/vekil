# Experimental OpenCode free-model compatibility configuration for Vekil.
#
# Uses the current OpenAI-compatible inference endpoint and the same anonymous
# "public" sentinel as OpenCode's signed-out client. The configured metadata
# follows OpenCode's request shape but identifies the application as Vekil.
# It is not a credential and does not guarantee free-tier access: the service
# can reject third-party clients with 403 FreeTierError or exhausted anonymous
# usage with 429 FreeUsageLimitError. Do not retry around those restrictions.
#
# Static discovery keeps paid models out of this anonymous configuration.
# The marked model block is generated from OpenCode's published endpoint and
# pricing tables by scripts/update-opencode-zen-free-config.sh; do not edit it
# by hand. CI intersects it with current Free price labels before inference.
# Do not make this a default catch-all provider. Endpoint allowlists describe
# native upstream support only; Chat-only entries cannot serve Codex Responses.
#
# Check current availability and data-handling terms before sending sensitive
# prompts: https://opencode.ai/v2/docs/console/models/
# Model-list reads do not establish that inference is available or permitted.
#
# Run:
#   vekil --port 8899 --providers-config examples/opencode-zen-free.yaml
#   curl http://127.0.0.1:8899/readyz
#   curl http://127.0.0.1:8899/v1/models
providers:
  - id: opencode-zen
    type: openai-compatible
    base_url: https://opencode.ai/inference/openai/v1
    auth_type: bearer
    api_key: public                         # anonymous sentinel, not a secret
    model_discovery: static
    # BEGIN GENERATED: OpenCode Zen free models
    models:
      - public_id: "beam-free"
        endpoints:
          - /chat/completions
      - public_id: "big-pickle"
        endpoints:
          - /chat/completions
      - public_id: "deepseek-v4.1-flash-free"
        endpoints:
          - /chat/completions
      - public_id: "flint-40b-free"
        endpoints:
          - /chat/completions
      - public_id: "glm-5.3-flash-free"
        endpoints:
          - /chat/completions
      - public_id: "mimo-v2.6-flash-free"
        endpoints:
          - /chat/completions
      - public_id: "nemotron-3-ultra-free"
        endpoints:
          - /chat/completions
      - public_id: "nemotron-3.5-lightning-free"
        endpoints:
          - /chat/completions
      - public_id: "nemotron-3.5-super-vl-free"
        endpoints:
          - /chat/completions
    # END GENERATED: OpenCode Zen free models
    # Keep this mapping last: the live smoke appends fresh per-run affinity.
    extra_headers:
      User-Agent: opencode/compat/2.1.2/vekil
      x-opencode-client: vekil
      x-opencode-project: vekil
