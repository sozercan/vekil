# OpenCode Zen free tier via Vekil.
#
# Reaches OpenCode Zen's free models anonymously using the literal sentinel
# key "public" (the same value the opencode client sends when no real key is
# configured). No signup, no OAuth, no token refresh.
#
# Caveats (see docs/provider-routing.md "OpenCode Zen Free Tier"):
#   - "public" is a SHARED ANONYMOUS key, rate-limited server-side per IP.
#   - The free set ROTATES and individual promotions END without notice. When a
#     promo ends, that model returns an error body (HTTP 401) such as
#     "Free promotion has ended for <model>". Re-check the live set before relying
#     on it:  curl -s https://opencode.ai/zen/v1/models -H 'authorization: Bearer public'
#   - Free models are NOT zero-retention ("collected data may be used to improve
#     the model"); north-mini-code-free (Cohere) and nemotron-3-ultra-free (NVIDIA)
#     add "trial use only / do not submit confidential data" terms. Do not route
#     proprietary or sensitive prompts through them.
#
# Use model_discovery: static (not openai): dynamic /models also lists PAID Zen
# models that reject the "public" key with HTTP 401, and there is no cost filter.
# Static discovery also skips the upstream readiness probe.
#
# Do NOT set default: true here. Under static discovery, unlisted models return
# HTTP 400, so making this the default catch-all only risks routing unknown
# models to a revocable trial gateway.
#
# Endpoint allowlists are per model. /responses is verified working upstream for
# deepseek-v4-flash-free, north-mini-code-free, and nemotron-3-ultra-free; the
# others are advertised as /chat/completions only (big-pickle returns HTTP 401
# "not supported for format openai" on /responses). Note: the GitHub Copilot CLI
# and Codex CLI use /responses with built-in tools that Zen free upstreams may
# reject; use COPILOT_PROVIDER_WIRE_API=completions for the Copilot CLI.
#
# For the full (paid) Zen catalog or higher limits, sign in at
# https://opencode.ai/auth and swap `api_key: public` for
# `api_key_env: OPENCODE_API_KEY` (still a static key, still no refresh).
#
# Run:
#   vekil --port 8899 --providers-config examples/opencode-zen-free.yaml
#   curl http://127.0.0.1:8899/readyz
#   curl http://127.0.0.1:8899/v1/models
providers:
  - id: opencode-zen
    type: openai-compatible
    base_url: https://opencode.ai/zen/v1   # proxy appends "/chat/completions"
    auth_type: bearer
    api_key: public                         # shared anonymous sentinel, not a secret
    model_discovery: static
    models:
      - public_id: big-pickle
        endpoints:
          - /chat/completions
      - public_id: deepseek-v4-flash-free
        endpoints:
          - /chat/completions
          - /responses
      - public_id: mimo-v2.5-free
        endpoints:
          - /chat/completions
      - public_id: nemotron-3-ultra-free    # NVIDIA API Trial Terms; no confidential data
        endpoints:
          - /chat/completions
          - /responses
      - public_id: north-mini-code-free      # Cohere Terms; no confidential data
        endpoints:
          - /chat/completions
          - /responses
