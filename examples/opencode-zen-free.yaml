# OpenCode Zen free tier via Vekil.
#
# Reaches OpenCode Zen's free models anonymously using the literal sentinel
# key "public" (the same value the opencode client sends when no real key is
# configured). No signup, no OAuth, no token refresh.
#
# Caveats (see docs/provider-routing.md "OpenCode Zen Free Tier"):
#   - "public" is a SHARED ANONYMOUS key, rate-limited server-side per IP.
#   - The free set ROTATES and individual promotions END without notice. Removed
#     models return HTTP 401 messages such as "Free promotion has ended for
#     <model>" or "Model <model> is not supported", or HTTP 400 with "Model is
#     unavailable". Re-check the live set:
#     curl -s https://opencode.ai/zen/v1/models -H 'authorization: Bearer public'
#   - Data handling varies by promotion. Ox Alpha's provider is documented as
#     zero-retention with no training use, while other free models may retain
#     prompts or use them for improvement. Check the current Zen terms before
#     routing proprietary or sensitive prompts.
#
# Use model_discovery: static (not openai): dynamic /models also lists PAID Zen
# models that reject the "public" key with HTTP 401, and there is no cost filter.
# Static discovery also skips the upstream readiness probe. The marked model
# block is generated from Zen's published endpoint and pricing tables by
# scripts/update-opencode-zen-free-config.sh; do not edit it by hand. Live CI
# still intersects it with current Free price labels before exercising models.
#
# Do NOT set default: true here. Under static discovery, unlisted models return
# HTTP 400, so making this the default catch-all only risks routing unknown
# models to a revocable trial gateway.
#
# Endpoint allowlists are per model and copied exactly from Zen's published
# table. Do not add an endpoint merely because Vekil can translate to it.
# Note: the GitHub Copilot CLI defaults to /responses, while Codex CLI requires
# a model advertising /responses. The shared Zen CLI smoke sets
# COPILOT_PROVIDER_WIRE_API=completions and tests only Chat-capable entries.
#
# For the full (paid) Zen catalog or higher limits, sign in at
# https://opencode.ai/auth and swap `api_key: public` for
# `api_key_env: OPENCODE_API_KEY` (still a static key, still no refresh).
#
# Run:
#   vekil --port 8899 --providers-config examples/opencode-zen-free.yaml
#   curl http://127.0.0.1:8899/readyz
#   curl http://127.0.0.1:8899/v1/models
providers:
  - id: opencode-zen
    type: openai-compatible
    base_url: https://opencode.ai/zen/v1   # proxy appends each model's endpoint
    auth_type: bearer
    api_key: public                         # shared anonymous sentinel, not a secret
    model_discovery: static
    # BEGIN GENERATED: OpenCode Zen free models
    models:
      - public_id: "big-pickle"
        endpoints:
          - /chat/completions
      - public_id: "ling-3.0-flash-fin-free"
        endpoints:
          - /chat/completions
      - public_id: "mimo-v2.5-free"
        endpoints:
          - /chat/completions
      - public_id: "muse-spark-1.3-contributor-free"
        endpoints:
          - /responses
      - public_id: "nemotron-3-ultra-free"
        endpoints:
          - /chat/completions
      - public_id: "nemotron-3.5-lightning-free"
        endpoints:
          - /chat/completions
    # END GENERATED: OpenCode Zen free models
