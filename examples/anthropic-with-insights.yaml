
insight_model: claude-opus-4.8

providers:
  - id: anthropic
    type: openai-compatible
    base_url: https://api.anthropic.com/v1
    auth_type: api-key-header
    auth_header: x-api-key
    api_key_env: ANTHROPIC_API_KEY
    model_discovery: static
    default: true
    models:
      - public_id: claude-opus-4.8
        deployment: claude-opus-4-8
        endpoints:
          - /chat/completions
      - public_id: claude-sonnet-4.6
        deployment: claude-sonnet-4-6
        endpoints:
          - /chat/completions
